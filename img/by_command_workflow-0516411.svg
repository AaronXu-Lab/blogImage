<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">AXO Fresh Design 主工作流</title>
  <desc id="desc">Fresh Design 主流程先运行 Design Release，再等待用户给出迁移范围、创建候选、执行设计迁移子工作流、处理 QA 与旧 PR 漂移，最终创建新主 PR、按需通知并安全收尾。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a;text-anchor:middle}.sub{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b;text-anchor:middle}.phase{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}.label{font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a;text-anchor:middle}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569;text-anchor:middle}.gateText{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4338ca;text-anchor:middle}.node{fill:#fff;stroke:#3b82f6;stroke-width:2;rx:14}.migration{fill:#ecfdf5;stroke:#22c55e;stroke-width:2;rx:14}.gate{fill:#eef2ff;stroke:#6366f1;stroke-width:2;stroke-dasharray:6 4;rx:12}.final{fill:#2563eb;stroke:#1d4ed8;stroke-width:2;rx:14}.white{font:650 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#fff;text-anchor:middle}.whiteSmall{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#dbeafe;text-anchor:middle}.line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.lane{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:7 7;rx:18}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#f8fafc"/>
  <text class="title" x="800" y="44">AXO Fresh Design · 主工作流</text>
  <text class="sub" x="800" y="70">将最新 QA 的 ADM Design 按用户 allowlist 迁移到 AFP，并交付唯一的新主 PR</text>

  <rect class="lane" x="45" y="100" width="1510" height="245"/>
  <text class="phase" x="70" y="130">发布、锁定基线与迁移</text>
  <rect class="node" x="85" y="170" width="300" height="125"/><text class="label" x="235" y="203">Design Release → F1</text><text class="small" x="235" y="231">发布本地 DS 更新（若有）</text><text class="small" x="235" y="255">同步 ADM 与后台契约到 qa</text><text class="small" x="235" y="279">qa 干净 · 保存 DS 版本结果</text>
  <path class="line" d="M385 233 H455"/>
  <rect class="node" x="455" y="170" width="310" height="125"/><text class="label" x="610" y="203">等待范围 · 创建候选</text><text class="small" x="610" y="231">F1 后等待用户给出 allowlist</text><text class="small" x="610" y="255">锁定全部开放旧 PR</text><text class="small" x="610" y="279">从 qa 新建 source并累计 revision</text>
  <path class="line" d="M765 233 H835"/>
  <rect class="migration" x="835" y="170" width="330" height="125"/><text class="label" x="1000" y="203">STEP 3 · 设计迁移子工作流</text><text class="small" x="1000" y="231">裁剪 → DS 依赖判断 → 页面结构</text><text class="small" x="1000" y="255">依赖才升级 AFP；无关则保持版本</text><text class="small" x="1000" y="279">静态证据 → 风险定向验证</text>
  <path class="line" d="M1165 233 H1235"/>
  <rect class="gate" x="1235" y="170" width="270" height="125"/><text class="gateText" x="1370" y="203">F2 / F3</text><text class="small" x="1370" y="231">契约与 UIUX 无回退</text><text class="small" x="1370" y="255">先披露已知可见差异</text><text class="small" x="1370" y="279">再 Review 目标与影响页</text>

  <rect class="lane" x="45" y="385" width="1510" height="315"/>
  <text class="phase" x="70" y="415">吸收漂移与交付</text>
  <path class="line" d="M1370 295 V508 H1165"/>
  <rect class="gate" x="835" y="440" width="330" height="135"/><text class="gateText" x="1000" y="474">F4 · QA / PR 漂移</text><text class="small" x="1000" y="502">吸收最新 qa 与新增旧 PR revision</text><text class="small" x="1000" y="528">ADM / formal / mixed 分类恢复</text><text class="small" x="1000" y="554">只重验受影响范围</text>
  <path class="line" d="M835 508 H765"/>
  <rect class="final" x="455" y="440" width="310" height="135"/><text class="white" x="610" y="474">F5 · 创建新主 PR</text><text class="whiteSmall" x="610" y="502">结构化验证后关闭全部旧 PR</text><text class="whiteSmall" x="610" y="528">保留全部远端 source</text><text class="whiteSmall" x="610" y="554">最终只剩新 PR开放</text>
  <path class="line" d="M455 508 H385"/>
  <rect class="node" x="85" y="440" width="300" height="135"/><text class="label" x="235" y="474">F6–F8 · 通知与收尾</text><text class="small" x="235" y="502">AFP 升级 DS 才增加版本行</text><text class="small" x="235" y="528">切回 qa并删除本地候选</text><text class="small" x="235" y="554">日志复盘与最小自维护</text>

  <rect class="lane" x="45" y="740" width="1510" height="165"/>
  <text class="phase" x="70" y="770">完成条件</text>
  <path class="line" d="M235 575 V833 H520"/>
  <rect class="final" x="520" y="795" width="560" height="75"/><text class="white" x="800" y="826">Fresh Design 完成</text><text class="whiteSmall" x="800" y="851">唯一新主 PR有效 · 通知结果已记录 · 本地回到干净 qa</text>
</svg>
