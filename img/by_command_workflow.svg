<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1300" viewBox="0 0 1680 1300" role="img" aria-labelledby="title desc">
  <title id="title">AXO Design Release 工作流</title>
  <desc id="desc">先并行、限时核对已完成状态、本地事实与远端分支 SHA；runner 保留初始 HEAD 与 merge-base，DS 只生成并发布一个已验证 tarball，自动 Smoke 后再推进机械 Gate。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a;text-anchor:middle}.sub{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#64748b;text-anchor:middle}.phase{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a;text-anchor:middle}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569;text-anchor:middle}.gateText{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4338ca;text-anchor:middle}.step{fill:#fff;stroke:#3b82f6;stroke-width:2;rx:14}.ds{fill:#f0fdfa;stroke:#0d9488;stroke-width:2;rx:14}.gate{fill:#eef2ff;stroke:#6366f1;stroke-width:2;stroke-dasharray:6 4;rx:14}.warn{fill:#fff7ed;stroke:#f97316;stroke-width:2;rx:14}.done{fill:#2563eb;stroke:#1d4ed8;stroke-width:2;rx:16}.white{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#fff;text-anchor:middle}.whiteSmall{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#dbeafe;text-anchor:middle}.line{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.return{fill:none;stroke:#f97316;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}.lane{fill:none;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:7 7;rx:18}
    </style>
  </defs>
  <rect width="1680" height="1300" fill="#f8fafc"/>
  <text class="title" x="840" y="46">AXO Design Release</text>
  <text class="sub" x="840" y="72">彻底发布设计源：DS 全量制品化 · ADM 同步最新契约 · UI 库更新后恢复 AFP 依赖与 Vite 缓存并验证页面</text>

  <rect class="step" x="75" y="105" width="350" height="92"/><text class="label" x="250" y="138">STEP 0 · 并行限时快速检查</text><text class="small" x="250" y="164">delivery / no-op 快照 + 本地事实</text><text class="small" x="250" y="185">app / DS ls-remote 并行 · 最多一次只读重试</text>
  <path class="line" d="M425 151 H485"/>
  <rect class="gate" x="485" y="95" width="350" height="112"/><text class="gateText" x="660" y="128">仍需发布或恢复？</text><text class="small" x="660" y="156">有变化 / 不确定 → 完整流程</text><text class="small" x="660" y="181">活动状态 → resume</text>
  <path class="line" d="M835 151 H895"/>
  <rect class="done" x="895" y="105" width="470" height="92"/><text class="white" x="1130" y="142">无变化 · 提前完成</text><text class="whiteSmall" x="1130" y="169">复用上一轮 G2 / G7 证明 · 跳过 G1–G7</text>
  <path class="line" d="M660 207 V275 H225 V305"/>

  <g transform="translate(0 140)">
  <rect class="lane" x="45" y="105" width="1590" height="410"/><text class="phase" x="70" y="135">双仓审核与 DS 制品边界</text>
  <rect class="step" x="75" y="165" width="300" height="92"/><text class="label" x="225" y="198">STEP 1 · runner v3 + 双仓范围</text><text class="small" x="225" y="224">保存 HEAD / QA / merge-base</text><text class="small" x="225" y="245">DS：全部本地 / outgoing 更新</text>
  <path class="line" d="M225 257 V286"/>
  <rect class="gate" x="75" y="286" width="300" height="104"/><text class="gateText" x="225" y="319">G1 · 双仓范围完整</text><text class="small" x="225" y="347">DS 不裁剪、不部分发布</text><text class="small" x="225" y="370">两仓均无敏感信息</text>

  <path class="line" d="M375 338 H430"/>
  <rect class="gate" x="430" y="276" width="270" height="124"/><text class="gateText" x="565" y="310">DS 有本地更新？</text><text class="small" x="565" y="340">有 → 全量 minor release</text><text class="small" x="565" y="366">无 → 验证当前锁定制品</text>
  <path class="line" d="M565 276 V242 H750"/>
  <rect class="ds" x="750" y="165" width="360" height="100"/><text class="label" x="930" y="198">STEP 2A · 发布 DS_V1</text><text class="small" x="930" y="224">唯一 tarball · ADM 兼容 Smoke</text><text class="small" x="930" y="246">commit/tag/push · 发布同一制品</text>
  <path class="line" d="M700 338 H750"/>
  <rect class="step" x="750" y="300" width="360" height="76"/><text class="label" x="930" y="330">STEP 2B · 复用 DS_V0</text><text class="small" x="930" y="354">不制造空版本 · 只读验证 registry</text>
  <path class="line" d="M1110 215 H1165 V300"/><path class="line" d="M1110 338 H1165"/>
  <rect class="gate" x="1165" y="276" width="400" height="124"/><text class="gateText" x="1365" y="310">G2 · DS 制品已确定</text><text class="small" x="1365" y="338">main / tag / registry / tree 一致</text><text class="small" x="1365" y="364">未知结果只读恢复 · 不换号重试</text>
  <rect class="warn" x="1165" y="420" width="400" height="70"/><text class="label" x="1365" y="449">不可逆边界</text><text class="small" x="1365" y="474">结果未知 → runner 只读恢复 · 禁止重复写入</text>

  <rect class="lane" x="45" y="555" width="1590" height="530"/><text class="phase" x="70" y="585">ADM 同步、验证与 QA 交付</text>
  <path class="line" d="M1365 400 V625"/>
  <rect class="step" x="1195" y="625" width="340" height="92"/><text class="label" x="1365" y="658">STEP 3 · ADM 锁定 DS_V1</text><text class="small" x="1365" y="684">精确 manifest + lockfile</text><text class="small" x="1365" y="705">fetch / rebase 最新 QA</text>
  <path class="line" d="M1195 671 H1135"/>
  <rect class="gate" x="795" y="615" width="340" height="112"/><text class="gateText" x="965" y="648">G3 · 制品与 QA 安全进入 ADM</text><text class="small" x="965" y="676">registry 实际版本 = DS_V1</text><text class="small" x="965" y="701">远端正式目录保持最新 QA tree</text>
  <path class="line" d="M795 671 H735"/>
  <rect class="step" x="405" y="625" width="330" height="92"/><text class="label" x="570" y="658">STEP 4 · 同步后台契约</text><text class="small" x="570" y="684">双范围基线 → ADM caller</text><text class="small" x="570" y="705">补齐 rebase 吸收的既有漂移</text>
  <path class="line" d="M405 671 H345"/>
  <rect class="gate" x="75" y="615" width="270" height="112"/><text class="gateText" x="210" y="648">G4 · 契约与 Design</text><text class="small" x="210" y="676">ahead=0 → no-op 完成</text><text class="small" x="210" y="701">不建空 commit · G5–G7 skipped</text>

  <path class="line" d="M210 727 V775"/>
  <rect class="step" x="75" y="775" width="350" height="92"/><text class="label" x="250" y="808">STEP 5 · 有候选才进入</text><text class="small" x="250" y="834">自动 Smoke · 单次最终 build</text><text class="small" x="250" y="855">squash 1 commit · 保存候选指纹</text>
  <path class="line" d="M425 821 H475"/>
  <rect class="gate" x="475" y="765" width="300" height="112"/><text class="gateText" x="625" y="798">G5 · ADM 候选可发布</text><text class="small" x="625" y="826">tree / SHA / 范围匹配</text><text class="small" x="625" y="851">ahead 恰好为 1</text>
  <path class="line" d="M775 821 H825"/>
  <rect class="step" x="825" y="775" width="300" height="92"/><text class="label" x="975" y="808">STEP 6 · 最终 QA fetch</text><text class="small" x="975" y="834">指纹未变：复用 G5 证据</text><text class="small" x="975" y="855">发生漂移：增量重跑 Gate</text>
  <path class="line" d="M1125 821 H1175"/>
  <rect class="gate" x="1175" y="765" width="310" height="112"/><text class="gateText" x="1330" y="798">G6 · 可 fast-forward</text><text class="small" x="1330" y="826">behind=0 · ahead=1</text><text class="small" x="1330" y="851">完整范围仍获授权</text>
  <path class="return" d="M975 775 V750 H625 V765"/>
  <path class="line" d="M1330 877 V925"/>
  <rect class="step" x="1175" y="925" width="310" height="82"/><text class="label" x="1330" y="958">STEP 7 · claim + push qa:qa</text><text class="small" x="1330" y="984">重新 fetch · 只读 resolve · 双仓证明</text>
  <path class="line" d="M1175 966 H1125"/>
  <rect class="gate" x="765" y="915" width="360" height="102"/><text class="gateText" x="945" y="948">G7 · 双仓交付已确认</text><text class="small" x="945" y="976">QA commit + DS 结构化版本结果</text><text class="small" x="945" y="999">均绑定已验证 SHA / tag / artifact</text>
  <path class="line" d="M765 966 H715"/>
  <rect class="done" x="255" y="915" width="460" height="102"/><text class="white" x="485" y="954">完成 · 设计源已彻底发布</text><text class="whiteSmall" x="485" y="982">返回 QA commit 与 DS 版本证明 · 无 PR · 无 force</text>
  </g>
</svg>
